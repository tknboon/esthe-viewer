<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>店舗情報 | 愛知県のアジアンエステ</title>
    <meta name="description" content="愛知県のアジアンエステ店舗情報。営業時間、電話番号、場所、レビューを確認できます。" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="店舗情報 | 愛知県のアジアンエステ" />
    <meta property="og:description" content="愛知県のアジアンエステ店舗情報。営業時間、電話番号、場所、レビューを確認できます。" />
    <meta property="og:site_name" content="愛知県のアジアンエステ" />
    <meta property="og:image" content="https://www.aichi-esthe.com/assets/ogp-common.png" />
    <meta property="og:image:alt" content="愛知県のアジアンエステ 店舗情報" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="店舗情報 | 愛知県のアジアンエステ" />
    <meta name="twitter:description" content="愛知県のアジアンエステ店舗情報。営業時間、電話番号、場所、レビューを確認できます。" />
    <meta name="twitter:image" content="https://www.aichi-esthe.com/assets/ogp-common.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell store-page-shell">
      <header class="hero store-page-hero">
        <div class="hero-copy-block">
          <p class="hero-kicker">店舗情報</p>
          <h1 id="storePageTitle">店舗を読み込み中</h1>
        </div>
      </header>

      <main class="store-page-layout">
        <section class="store-page-main">
          <article class="store-card store-detail-card">
            <div class="store-head">
              <div>
                <h2 id="storeName" class="store-title">店舗を読み込み中</h2>
                <p id="storeStation" class="store-station"></p>
              </div>
              <div id="storeBadges" class="store-badges"></div>
            </div>

            <div id="storeInfoGrid" class="store-grid"></div>

            <div id="storeActions" class="store-actions store-detail-actions"></div>
          </article>

          <section class="panel-block store-page-section">
            <div class="analytics-head">
              <span class="input-label">店舗レビュー</span>
              <strong id="reviewSummary" class="analytics-total">0件</strong>
            </div>
            <div id="reviewList" class="review-list store-page-review-list">
              <div class="empty-state compact">レビューを確認中です。</div>
            </div>
          </section>
        </section>

        <aside class="store-page-side">
          <section class="panel-block">
            <p class="mini-label">共有</p>
            <div class="store-side-actions">
              <a class="action-link primary" href="./index.html">地図に戻る</a>
              <a id="lineShareButton" class="action-link primary" href="https://social-plugins.line.me/lineit/share?url=https%3A%2F%2Fwww.aichi-esthe.com%2Fstore.html" target="_blank" rel="noreferrer">LINE</a>
              <a id="xShareButton" class="action-link" href="https://twitter.com/intent/tweet?url=https%3A%2F%2Fwww.aichi-esthe.com%2Fstore.html&text=%E5%BA%97%E8%88%97%E6%83%85%E5%A0%B1%20%7C%20%E6%84%9B%E7%9F%A5%E7%9C%8C%E3%81%AE%E3%82%A2%E3%82%B8%E3%82%A2%E3%83%B3%E3%82%A8%E3%82%B9%E3%83%86" target="_blank" rel="noreferrer">X</a>
              <button id="nativePageShareButton" class="action-link" type="button">共有</button>
              <button id="copyPageUrlButton" class="action-link" type="button">コピー</button>
            </div>
            <p id="copyStatusText" class="sync-meta-text"></p>
          </section>

          <section class="panel-block">
            <p class="mini-label">近くの候補</p>
            <div id="nearbyStoreList" class="nearby-store-list">
              <div class="empty-state compact">店舗を読み込み中です。</div>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script src="./data.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script>
    <script src="./store-page.js"></script>
  </body>
</html>
